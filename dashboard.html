<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ModelXI — AI football dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0A0F1A; --panel:#111A2B; --panel-2:#0D1524; --side:#0C1320;
    --line:rgba(180,200,230,0.09); --line-strong:rgba(180,200,230,0.16);
    --text:#E9EEF6; --body:#C3CCDA; --muted:#8290A6; --muted-dim:#586479;
    --amber:#F5B13C; --home:#F5B13C; --draw:#6C7A93; --away:#4F9DA6;
    --strong:#57C08B; --lean:#F5B13C; --toss:#8290A6;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--ink); color:var(--text);
    font-family:'Inter',system-ui,sans-serif; line-height:1.55; -webkit-font-smoothing:antialiased;}
  .mono{font-family:'Space Mono',monospace;}
  :focus-visible{outline:2px solid var(--amber); outline-offset:2px; border-radius:4px;}
  button{font-family:inherit; cursor:pointer;}
  .app{display:flex; min-height:100vh;}
  .side{width:236px; flex-shrink:0; background:var(--side); border-right:1px solid var(--line);
    padding:20px 14px 0; display:flex; flex-direction:column; position:sticky; top:0; height:100vh;}
  .brand{display:flex; align-items:center; gap:10px; padding:0 6px 18px;}
  .logo{width:26px; height:26px; border-radius:7px; border:1.5px solid var(--amber);
    display:inline-flex; align-items:center; justify-content:center;}
  .logo span{width:11px; height:1.5px; background:var(--amber); display:block;}
  .wordmark{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:17px; letter-spacing:.02em;}
  .leagues{flex:1 1 auto; min-height:0; overflow-y:auto; padding-right:2px;}
  .leagues::-webkit-scrollbar{width:6px;} .leagues::-webkit-scrollbar-thumb{background:var(--line-strong); border-radius:3px;}
  .navsub{font-family:'Space Mono',monospace; font-size:9.5px; letter-spacing:.12em;
    text-transform:uppercase; color:var(--muted-dim); padding:12px 8px 5px;}
  .leaguebtn{display:flex; align-items:center; justify-content:space-between; width:100%;
    background:none; border:none; color:var(--muted); text-align:left; padding:8px 10px;
    border-radius:9px; font-size:13px; margin-bottom:1px;}
  .leaguebtn:hover{background:rgba(180,200,230,0.05); color:var(--text);}
  .leaguebtn.active{background:rgba(245,177,60,0.10); color:var(--text);}
  .leaguebtn.active .cnt{color:var(--amber);}
  .cnt{font-family:'Space Mono',monospace; font-size:11px; color:var(--muted-dim);}
  .side .foot{flex:0 0 auto; padding:12px 8px; font-size:10px; color:var(--muted-dim); line-height:1.5;
    border-top:1px solid var(--line); margin-top:6px;}
  .main{flex:1; min-width:0; padding:26px 28px 60px;}
  .head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap;}
  .head h1{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:26px; margin:0; letter-spacing:-.01em;}
  .head .sub{color:var(--muted); font-size:12.5px; margin-top:4px;}
  .fresh{font-family:'Space Mono',monospace; font-size:11px; color:var(--muted-dim);}
  .days{display:flex; gap:8px; margin:18px 0 20px; flex-wrap:wrap;}
  .day{background:var(--panel-2); border:1px solid var(--line); color:var(--muted);
    padding:7px 13px; border-radius:999px; font-size:12.5px;}
  .day:hover{color:var(--text);}
  .day.active{background:var(--text); color:var(--ink); border-color:var(--text); font-weight:600;}
  .picks{display:flex; align-items:center; gap:14px; margin:2px 0 22px; flex-wrap:wrap;
    background:linear-gradient(90deg, rgba(245,177,60,.10), rgba(245,177,60,.02));
    border:1px solid rgba(245,177,60,.28); border-radius:13px; padding:12px 16px;}
  .pickbtn{display:inline-flex; align-items:center; gap:8px; background:var(--amber); color:#1a1205;
    border:1px solid var(--amber); padding:11px 20px; border-radius:999px;
    font-family:'Space Grotesk',sans-serif; font-size:14.5px; font-weight:700; letter-spacing:.01em;
    box-shadow:0 6px 18px rgba(245,177,60,.18); transition:transform .12s ease, filter .12s ease;}
  .pickbtn:hover{filter:brightness(1.06); transform:translateY(-1px);}
  .pickbtn .star{font-size:15px;}
  .pickbtn.active{background:var(--panel-2); color:var(--amber); border-color:rgba(245,177,60,.6);
    box-shadow:none;}
  .picks .blurb{font-size:12.5px; color:var(--muted); flex:1; min-width:140px;}
  .picks .blurb b{color:var(--text); font-weight:600;}
  .pickcount{display:inline-flex; align-items:center; gap:8px; font-size:13px; color:var(--text);}
  .pickcount select{background:var(--panel); color:var(--text); border:1px solid rgba(245,177,60,.5);
    border-radius:8px; padding:7px 9px; font-family:'Space Mono',monospace; font-size:14px; font-weight:700;}
  .rank{display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px;
    border-radius:6px; background:rgba(245,177,60,.14); color:var(--amber);
    font-family:'Space Mono',monospace; font-size:11px; font-weight:700; margin-right:8px; vertical-align:middle;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:14px;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:15px; padding:17px;}
  .eyebrow{font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.1em;
    text-transform:uppercase; color:var(--muted);}
  .teams{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:18px; line-height:1.25; margin:8px 0 12px;}
  .teams .v{color:var(--muted-dim); font-weight:400; margin:0 6px;}
  .call{border-radius:11px; padding:11px 13px; margin-bottom:13px; background:var(--panel-2); border:1px solid var(--line);}
  .call .lbl{font-family:'Space Mono',monospace; font-size:9px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted-dim);}
  .call .row{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-top:5px;}
  .call .pick{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:19px;}
  .call .prob{font-family:'Space Mono',monospace; font-weight:700; font-size:18px;}
  .spine{display:flex; height:9px; border-radius:999px; overflow:hidden; border:1px solid var(--line-strong);}
  .legend{display:flex; justify-content:space-between; gap:8px; margin-top:9px; flex-wrap:wrap;}
  .leg{display:flex; align-items:center; gap:6px; font-size:11px; color:var(--muted);}
  .leg b{color:var(--text); font-family:'Space Mono',monospace; font-weight:700;}
  .dot{width:7px; height:7px; border-radius:2px; display:inline-block;}
  .chips{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin:13px 0;}
  .chip{background:var(--panel-2); border:1px solid var(--line); border-radius:9px; padding:8px 5px; text-align:center;}
  .chip .v{font-family:'Space Mono',monospace; font-weight:700; font-size:13px;}
  .chip .k{font-size:9px; color:var(--muted); margin-top:2px;}
  details.analysis{border-top:1px solid var(--line); padding-top:11px;}
  details.analysis summary{font-family:'Space Mono',monospace; font-size:10.5px; letter-spacing:.06em;
    text-transform:uppercase; color:var(--muted); cursor:pointer; list-style:none;}
  details.analysis summary::-webkit-details-marker{display:none;}
  details.analysis summary::after{content:' \25BE'; color:var(--muted-dim);}
  details.analysis[open] summary::after{content:' \25B4';}
  .analysis .body{font-size:13px; color:var(--body); margin-top:10px;}
  .analysis .body .headline{color:var(--text); font-weight:600; margin:0 0 7px;}
  .analysis .body p{margin:0 0 7px;}
  .analysis .body strong{color:var(--text);}
  details.markets{border-top:1px solid var(--line); padding-top:11px;}
  details.markets summary{font-family:'Space Mono',monospace; font-size:10.5px; letter-spacing:.06em;
    text-transform:uppercase; color:var(--muted); cursor:pointer; list-style:none;}
  details.markets summary::-webkit-details-marker{display:none;}
  details.markets summary::after{content:' \25BE'; color:var(--muted-dim);}
  details.markets[open] summary::after{content:' \25B4';}
  .mkg{font-family:'Space Mono',monospace; font-size:9.5px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--muted-dim); margin:11px 0 3px;}
  .mkrow{display:flex; justify-content:space-between; font-size:12px; color:var(--body);
    padding:3px 0; border-bottom:1px solid var(--line);}
  .mkrow .mono{color:var(--text); font-weight:700;}
  .empty{grid-column:1/-1; text-align:center; color:var(--muted); padding:60px 20px;
    border:1px dashed var(--line-strong); border-radius:14px;}
  @media (max-width:760px){
    .app{flex-direction:column;}
    .side{width:100%; height:auto; position:static; flex-direction:column; padding:14px 14px 6px;}
    .brand{padding-bottom:12px;}
    .leagues{flex:initial; overflow-y:visible;}
    .navsub{display:none;}
    .leagues{display:flex; gap:6px; overflow-x:auto; padding-bottom:6px;}
    .leaguebtn{width:auto; white-space:nowrap; flex-shrink:0; padding:8px 12px; border:1px solid var(--line);}
    .leaguebtn .cnt{display:none;}
    .side .foot{display:none;}
    .main{padding:18px 16px 50px;}
    .grid{grid-template-columns:1fr;}
  }
  @media (prefers-reduced-motion:no-preference){
    .card{opacity:0; animation:rise .45s ease forwards;}
    @keyframes rise{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <a class="brand" href="index.html" style="text-decoration:none;color:inherit"><span class="logo"><span></span></span><span class="wordmark">ModelXI</span></a>
    <div class="leagues" id="leagues"></div>
    <div class="foot">Statistical analysis, not betting advice. No outcome is guaranteed. 18+ · gamble responsibly.</div>
  </aside>
  <main class="main">
    <div class="head">
      <div>
        <h1 id="title">Today's football</h1>
        <div class="sub" id="subtitle"></div>
      </div>
      <div class="fresh" id="fresh"></div>
    </div>
    <div class="days" id="days"></div>
    <div class="picks">
      <button class="pickbtn" id="pick-toggle"><span class="star">★</span> Top picks</button>
      <span class="blurb" id="pick-blurb">Let the model surface the day's <b>most confident calls</b>, ranked.</span>
      <span class="pickcount" id="pick-count" style="display:none">
        Show
        <select id="topn" aria-label="Number of picks">
          <option>1</option><option>2</option><option>3</option><option>4</option>
          <option selected>5</option><option>6</option><option>7</option>
          <option>8</option><option>9</option><option>10</option>
        </select>
        best calls
      </span>
    </div>
    <div class="grid" id="grid"><div class="empty">Loading predictions…</div></div>
  </main>
</div>

<script>
// order + region grouping for the sidebar (names must match generate.py exactly)
const REGION_ORDER = ["Europe","Americas","World"];
const REGION = {
  "Premier League":"Europe","La Liga":"Europe","Serie A":"Europe","Bundesliga":"Europe",
  "Ligue 1":"Europe","Champions League":"Europe","Europa League":"Europe","Championship":"Europe",
  "Eredivisie":"Europe","Primeira Liga":"Europe","Belgian Pro League":"Europe","Super Lig":"Europe",
  "Scottish Premiership":"Europe","Liga I":"Europe",
  "Brazil Serie A":"Americas","Argentina Primera":"Americas","MLS":"Americas","Liga MX":"Americas",
  "Saudi Pro League":"World","J1 League":"World"
};
const LEAGUE_ORDER = ["Premier League","La Liga","Serie A","Bundesliga","Ligue 1","Champions League",
  "Europa League","Championship","Eredivisie","Primeira Liga","Belgian Pro League","Super Lig",
  "Scottish Premiership","Liga I","Brazil Serie A","Argentina Primera","MLS","Liga MX",
  "Saudi Pro League","J1 League"];

let DATA = { generated_at:null, predictions:[] };
const state = { league:'all', day:'all', top:false, topN:5 };

const pct = x => Math.round(x*100);
const sColor = s => ({strong:'var(--strong)',lean:'var(--lean)'}[s]||'var(--toss)');
const sWord  = s => ({strong:'Strong',lean:'Lean'}[s]||'Coin flip');
const mdBold = t => t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');

function dayKey(iso){ return new Date(iso).toISOString().slice(0,10); }
function dayLabel(iso){
  const d=new Date(iso), t=new Date();
  const k=dayKey(iso), tk=t.toISOString().slice(0,10);
  const tm=new Date(t); tm.setDate(t.getDate()+1);
  if(k===tk) return "Today";
  if(k===tm.toISOString().slice(0,10)) return "Tomorrow";
  return d.toLocaleDateString(undefined,{weekday:'short',day:'2-digit',month:'short'});
}
function kickTime(iso){ return new Date(iso).toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}); }
function ago(iso){
  if(!iso) return '';
  const s=Math.floor((Date.now()-new Date(iso))/1000);
  if(s<90) return 'updated just now';
  const m=Math.floor(s/60); if(m<90) return `updated ${m} min ago`;
  const h=Math.floor(m/60); if(h<36) return `updated ${h} h ago`;
  return `updated ${Math.floor(h/24)} d ago`;
}
function analysisHtml(text){
  const p=String(text||'').split('\n\n');
  const head=`<p class="headline">${mdBold(p[0]).replace(/^<strong>|<\/strong>$/g,'')}</p>`;
  return head + p.slice(1).map(x=>`<p>${mdBold(x)}</p>`).join('');
}
function marketsHtml(m){
  if(!Array.isArray(m)||!m.length) return '<p style="color:var(--muted-dim);font-size:12px;margin-top:8px">Full market breakdown appears after the next data refresh.</p>';
  return m.map(g=>`<div class="mkg">${g.group}</div>`+
    g.rows.map(r=>`<div class="mkrow"><span>${r[0]}</span><span class="mono">${Math.round(r[1]*100)}%</span></div>`).join('')
  ).join('');
}
function card(p, rank){
  const c=sColor(p.primary_strength);
  return `<article class="card">
    <div class="eyebrow">${p.league} \u00b7 ${dayLabel(p.kickoff)} ${kickTime(p.kickoff)}</div>
    <div class="teams">${rank?`<span class="rank">${rank}</span>`:''}${p.home}<span class="v">v</span><span style="color:var(--muted)">${p.away}</span></div>
    <div class="call" style="border-color:${c}55;border-left:3px solid ${c}">
      <div class="lbl">The call</div>
      <div class="row"><span class="pick">${p.primary_pick}</span>
        <span style="text-align:right"><span class="prob" style="color:${c}">${pct(p.primary_prob)}%</span>
        <div class="mono" style="font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:${c}">${sWord(p.primary_strength)}</div></span>
      </div>
    </div>
    <div class="spine" role="img" aria-label="${p.home} ${pct(p.prob_home)}%, draw ${pct(p.prob_draw)}%, ${p.away} ${pct(p.prob_away)}%">
      <i style="width:${pct(p.prob_home)}%;background:var(--home)"></i>
      <i style="width:${pct(p.prob_draw)}%;background:var(--draw)"></i>
      <i style="width:${pct(p.prob_away)}%;background:var(--away)"></i>
    </div>
    <div class="legend">
      <span class="leg"><span class="dot" style="background:var(--home)"></span>${p.home} <b>${pct(p.prob_home)}%</b></span>
      <span class="leg"><span class="dot" style="background:var(--draw)"></span>Draw <b>${pct(p.prob_draw)}%</b></span>
      <span class="leg"><span class="dot" style="background:var(--away)"></span>${p.away} <b>${pct(p.prob_away)}%</b></span>
    </div>
    <div class="chips">
      <div class="chip"><div class="v">${p.xg_home}\u2013${p.xg_away}</div><div class="k">xG</div></div>
      <div class="chip"><div class="v">${pct(p.over25)}%</div><div class="k">Over 2.5</div></div>
      <div class="chip"><div class="v">${pct(p.btts)}%</div><div class="k">BTTS</div></div>
      <div class="chip"><div class="v">${p.top_score}</div><div class="k">~${pct(p.top_score_prob)}%</div></div>
    </div>
    <details class="markets"><summary>All markets</summary><div>${marketsHtml(p.markets)}</div></details>
    <details class="analysis"><summary>Analysis</summary><div class="body">${analysisHtml(p.analysis)}</div></details>
  </article>`;
}

function counts(){ const c={}; DATA.predictions.forEach(p=>c[p.league]=(c[p.league]||0)+1); return c; }
function leagueBtn(id,label,n,active){
  return `<button class="leaguebtn${active?' active':''}" data-league="${id}"><span>${label}</span><span class="cnt">${n}</span></button>`;
}

function render(){
  const c=counts();
  const present=[...new Set(DATA.predictions.map(p=>p.league))];
  const ordered=[...LEAGUE_ORDER.filter(l=>present.includes(l)),
                 ...present.filter(l=>!LEAGUE_ORDER.includes(l))];
  // sidebar: All leagues, then region groups
  let nav = leagueBtn('all','All leagues', DATA.predictions.length, state.league==='all');
  for(const region of REGION_ORDER){
    const inR = ordered.filter(l => (REGION[l]||'World')===region);
    if(!inR.length) continue;
    nav += `<div class="navsub">${region}</div>`;
    inR.forEach(l => nav += leagueBtn(l, l, c[l], state.league===l));
  }
  const unmapped = ordered.filter(l => !REGION[l]);
  if(unmapped.length){ nav += `<div class="navsub">Other</div>`; unmapped.forEach(l=> nav += leagueBtn(l,l,c[l],state.league===l)); }
  document.getElementById('leagues').innerHTML = nav;

  let set=DATA.predictions.filter(p=>state.league==='all'||p.league===state.league);
  const dayKeys=[...new Set(set.map(p=>dayKey(p.kickoff)))].sort();
  const days=['all',...dayKeys];
  if(!days.includes(state.day)) state.day='all';
  document.getElementById('days').innerHTML = days.map(d=>{
    const active=state.day===d?' active':'';
    const label=d==='all'?'All days':dayLabel(set.find(p=>dayKey(p.kickoff)===d).kickoff);
    return `<button class="day${active}" data-day="${d}">${label}</button>`;
  }).join('');

  if(state.day!=='all') set=set.filter(p=>dayKey(p.kickoff)===state.day);

  // sync the Top picks control
  document.getElementById('pick-toggle').classList.toggle('active', state.top);
  document.getElementById('pick-count').style.display = state.top ? 'inline-flex' : 'none';
  document.getElementById('pick-blurb').style.display = state.top ? 'none' : 'inline';

  const todayK=new Date().toISOString().slice(0,10);
  if(state.top){
    set = set.slice().sort((a,b)=> b.primary_prob - a.primary_prob).slice(0, state.topN);
    document.getElementById('title').textContent = `Top ${state.topN} pick${state.topN>1?'s':''}`;
    document.getElementById('subtitle').textContent = 'Ranked by the model\u2019s confidence' +
      (state.league!=='all' ? ` \u00b7 ${state.league}` : '');
    document.getElementById('fresh').textContent = ago(DATA.generated_at);
    document.getElementById('grid').innerHTML = set.length
      ? set.map((p,i)=>card(p,i+1)).join('')
      : `<div class="empty">No matches to rank here. Try another day or league.</div>`;
    return;
  }

  set.sort((a,b)=>new Date(a.kickoff)-new Date(b.kickoff));
  document.getElementById('title').textContent =
    state.league!=='all' ? state.league : (state.day===todayK ? "Today's football" : "All leagues");
  document.getElementById('subtitle').textContent = `${set.length} match${set.length===1?'':'es'} analysed`;
  document.getElementById('fresh').textContent = ago(DATA.generated_at);
  document.getElementById('grid').innerHTML = set.length
    ? set.map(p=>card(p)).join('')
    : `<div class="empty">No matches here. Try another day or league.</div>`;
}

document.addEventListener('click', e=>{
  const lb=e.target.closest('[data-league]'); if(lb){ state.league=lb.dataset.league; state.day='all'; render(); }
  const db=e.target.closest('[data-day]'); if(db){ state.day=db.dataset.day; render(); }
  if(e.target.closest('#pick-toggle')){ state.top=!state.top; render(); }
});
document.addEventListener('change', e=>{
  if(e.target.id==='topn'){ state.topN=+e.target.value; if(state.top) render(); }
});

async function load(){
  try{
    const res = await fetch('predictions.json', {cache:'no-store'});
    if(!res.ok) throw new Error('no file');
    DATA = await res.json();
  }catch(e){
    document.getElementById('grid').innerHTML =
      `<div class="empty">Predictions haven't been generated yet.<br>The daily job will fill this in shortly.</div>`;
    return;
  }
  if(!DATA.predictions || !DATA.predictions.length){
    document.getElementById('grid').innerHTML =
      `<div class="empty">No upcoming matches in range right now. Check back soon.</div>`;
    return;
  }
  // homepage default: show today's matches if there are any, else everything
  const todayK=new Date().toISOString().slice(0,10);
  if(DATA.predictions.some(p=>dayKey(p.kickoff)===todayK)) state.day = todayK;
  render();
}
load();
</script>
</body>
</html>
