name: Daily predictions

on:
  schedule:
    - cron: "0 6 * * *"      # every day at 06:00 UTC
  workflow_dispatch:          # also lets you run it by hand from the Actions tab

permissions:
  contents: write             # allows the job to commit predictions.json back

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate predictions
        env:
          API_FOOTBALL_KEY:  ${{ secrets.API_FOOTBALL_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate.py

      - name: Commit the updated predictions
        run: |
          git config user.name  "chalk-bot"
          git config user.email "chalk-bot@users.noreply.github.com"
          git add -A
          git commit -m "Update predictions and record" || echo "No changes to commit"
          git push
